name: Coverage draft integrity and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install selected check tools
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-build.txt
          npm ci --prefix tools/node --ignore-scripts --no-audit --no-fund
      - name: Verify fixed artifacts and reproduce review renderings
        run: python scripts/check_draft.py --render --idnits tools/node/node_modules/.bin/idnits --output-dir build/qa
      - name: Test the release transport without network submission
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Retain original check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-00-checks
          path: build/qa/
          if-no-files-found: warn
          retention-days: 14
